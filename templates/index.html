<!DOCTYPE html>
<html>
<head>
    <title>Image Recognition System</title>

    <style>

        body{
            font-family: Arial;
            text-align:center;
            margin-top:50px;
        }

        h1{
            color:green;
        }

        button{
            padding:10px;
            font-size:16px;
        }

    </style>

</head>

<body>

    <h1>Image Recognition System</h1>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" name="image" required>

        <br><br>

        <button type="submit">
            Predict
        </button>

    </form>

    <h2>{{ prediction }}</h2>

</body>
</html>
